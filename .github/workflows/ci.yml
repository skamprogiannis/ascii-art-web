name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Go and frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Run unit tests
        run: go test -short -cover ./...

      - name: Run race detector
        run: go test -race -short ./...

      - name: Run vet
        run: go vet ./...

      - name: Build application
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Check frontend JavaScript
        run: node --check static/app.js

  container:
    name: Container integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and smoke-test container
        run: ./docker_integration_test.sh
